# Plain HTTP. Use it when TLS ends in front of this container (a host Nginx, Caddy or a load balancer that
# sets X-Forwarded-Proto), or for a local rehearsal on http://127.0.0.1:8080. With TLS in this container,
# use https.conf instead.
include /etc/nginx/wildward/common-http.conf;

map $http_x_forwarded_proto $wildward_scheme {
    default $scheme;
    https https;
}

server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/wildward/locations.conf;
}
