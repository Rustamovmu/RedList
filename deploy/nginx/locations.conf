# Shared by http.conf and https.conf. Requests reach the apps on the private Docker network only.

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Internal-only routes: the API calls the web app's revalidate hook directly (http://web:3000), never through here.
location = /api/revalidate { return 404; }
location ^~ /api/docs { return 404; }

# Staff sign-in: a coarse per-IP limit in front of the API's own throttle and lockout (DECISIONS D-010).
location = /api/v1/staff/auth/login {
    limit_req zone=wildward_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://wildward_api;
    include /etc/nginx/wildward/proxy.conf;
}

# Public images: pre-generated WebP variants with long cache headers from the API. Not rate limited, because a
# list page loads one per card and a classroom may share a single address.
location /api/v1/media/ {
    proxy_pass http://wildward_api;
    include /etc/nginx/wildward/proxy.conf;
}

# Uploads go through /api/v1/staff/media: MEDIA_MAX_BYTES (15 MB) plus multipart overhead.
location /api/v1/ {
    client_max_body_size 16m;
    limit_req zone=wildward_api burst=120 nodelay;
    limit_req_status 429;
    proxy_pass http://wildward_api;
    include /etc/nginx/wildward/proxy.conf;
}

location / {
    client_max_body_size 1m;
    proxy_pass http://wildward_web;
    include /etc/nginx/wildward/proxy.conf;
}
