# TLS in this container. Set NGINX_SITE_CONF=./nginx/https.conf and SERVER_NAME, mount the certificates and
# publish 443 (see docker-compose.prod.yml and docs/DEPLOYMENT.md). Replace example.org with your domain.
include /etc/nginx/wildward/common-http.conf;

map $scheme $wildward_scheme { default $scheme; }

server {
    listen 80 default_server;
    server_name _;
    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.org;
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:wildward_tls:10m;
    ssl_session_timeout 1d;
    # Start with a short max-age; raise it to 31536000 once HTTPS has worked for a while.
    add_header Strict-Transport-Security "max-age=86400" always;
    include /etc/nginx/wildward/locations.conf;
}
