# http-context settings shared by http.conf and https.conf.
upstream wildward_api { server api:4000; keepalive 16; }
upstream wildward_web { server web:3000; keepalive 16; }

limit_req_zone $binary_remote_addr zone=wildward_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=wildward_api:10m rate=30r/s;

server_tokens off;

# The basemap (~570 kB of GeoJSON) and catalogue JSON compress well (D-016).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/geo+json application/javascript text/css text/plain text/xml application/xml image/svg+xml;
