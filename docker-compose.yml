# Local development database. The port binds to 127.0.0.1 only.
services:
  db:
    image: imresamu/postgis:16-3.4   # multi-arch (arm64 + amd64); see DECISIONS D-003
    restart: unless-stopped
    environment:
      POSTGRES_USER: wild
      POSTGRES_PASSWORD: wild
      POSTGRES_DB: wild
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wild_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wild -d wild"]
      interval: 5s
      retries: 10
volumes:
  wild_pg:
